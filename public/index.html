<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden AI Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Golden AI Chatbot</h1>
      <div id="chat-box" class="chat-box"></div>
      <form id="chat-form">
      <div class="file-attachment-group">
        <div class="file-input-area">
          <!-- The + button to toggle the dropdown -->
          <button type="button" id="toggle-file-dropdown-button" class="icon-button" style="color: black;" title="Attach file">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <!-- The dropdown itself -->
          <div id="file-type-dropdown" class="file-type-dropdown">
            <label for="file-input" class="file-type-option" data-type="pdf" title="Attach PDF">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="14 2 14 9 21 9"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
              <span>PDF</span>
            </label>
            <label for="file-input" class="file-type-option" data-type="mp3" title="Attach MP3">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
              <span>MP3</span>
            </label>
            <label for="file-input" class="file-type-option" data-type="image" title="Attach Image">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span>Image</span>
            </label>
          </div>
        </div>
        <input type="file" id="file-input" name="file" accept="application/pdf, audio/mpeg, image/*" class="visually-hidden" />
        <span id="selected-file-name" class="selected-file-name"></span>
      </div>
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />
      <button type="submit" title="Send message">Send</button>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
